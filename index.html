<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Intelligence</title>
    <!-- External Stylesheet link -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Transaction Intelligence</h1>
        </header>

        <!-- 3D Animated Stat Cards -->
        <div class="stats-grid">
            <div class="stat-card income-card">
                <div class="stat-title">Total Received (Income)</div>
                <div class="stat-amount income" id="total-income">₹0.00</div>
            </div>
            <div class="stat-card expense-card">
                <div class="stat-title">Total Spent (Expense)</div>
                <div class="stat-amount expense" id="total-expense">₹0.00</div>
            </div>
        </div>

        <!-- Ledger History Table -->
        <div class="table-section">
            <h2>Ledger History</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Payment Mode</th>
                            <th>Type</th>
                            <th style="text-align: right;">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-table-body">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #94a3b8; padding: 30px;">Loading database records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Data Rendering & Supabase Integration Script -->
    <script>
        const SUPABASE_URL = 'https://sxdkghnpltvdvlkblkps.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4ZGtnaG5wbHR2ZHZsa2Jsa3BzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjU5NTYsImV4cCI6MjEwODg0MTk1Nn0.2rm0p2gvSKkD6R_0YcONkg4vTyX_kdhDxfKS4AUnN3U';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadDashboardData() {
            try {
                const { data, error } = await _supabase
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) {
                    console.error('Supabase error:', error);
                    return;
                }

                let totalIncome = 0;
                let totalExpense = 0;
                const tbody = document.getElementById('transaction-table-body');
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 30px;">No transaction records found</td></tr>';
                    return;
                }

                data.forEach((tx, index) => {
                    const amount = Number(tx.amount);
                    const isIncome = tx.type === 'income';

                    if (isIncome) {
                        totalIncome += amount;
                    } else if (tx.type === 'expense') {
                        totalExpense += amount;
                    }

                    const tr = document.createElement('tr');
                    tr.style.animationDelay = `${index * 0.03}s`;

                    const sign = isIncome ? '+' : '-';
                    const amountClass = isIncome ? 'income' : 'expense';

                    tr.innerHTML = `
                        <td>${tx.date || '--'}</td>
                        <td style="max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${escapeHtml(tx.description || '')}">${escapeHtml(tx.description || 'Bank Transaction')}</td>
                        <td>${tx.payment_mode || 'UPI'}</td>
                        <td><span class="badge ${tx.type}">${tx.type.toUpperCase()}</span></td>
                        <td style="text-align: right;" class="amount-text ${amountClass}">${sign}₹${amount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('total-income').innerText = `₹${totalIncome.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
                document.getElementById('total-expense').innerText = `₹${totalExpense.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;

            } catch (err) {
                console.error('Unexpected error loading data:', err);
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        loadDashboardData();
    </script>
</body>
</html>
