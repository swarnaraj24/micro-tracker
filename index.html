<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Transaction Intelligence</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-income: #10b981;
            --accent-expense: #ef4444;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #ffffff;
        }

        /* 3D Animated Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            perspective: 1000px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            backdrop-filter: blur(16px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
        }

        .stat-card:hover {
            transform: translateY(-6px) rotateX(4deg) rotateY(-4deg);
        }

        .stat-card.income:hover {
            box-shadow: 0 20px 40px -15px rgba(16, 185, 129, 0.2), 0 0 25px rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .stat-card.expense:hover {
            box-shadow: 0 20px 40px -15px rgba(239, 68, 68, 0.2), 0 0 25px rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .stat-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .stat-amount {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .stat-card.income .stat-amount { color: var(--accent-income); }
        .stat-card.expense .stat-amount { color: var(--accent-expense); }

        /* Transactions Section */
        .transactions-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
        }

        .transactions-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-secondary);
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .transaction-list::-webkit-scrollbar {
            width: 6px;
        }
        .transaction-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem;
            background: rgba(11, 15, 25, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
        }

        .transaction-item:hover {
            background: rgba(30, 41, 59, 0.8);
            transform: scale(1.01);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .tx-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .tx-desc {
            font-weight: 500;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .tx-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .tx-amount {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .tx-amount.income { color: var(--accent-income); }
        .tx-amount.expense { color: var(--accent-expense); }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Transaction Intelligence</h1>
        </header>

        <!-- 3D Interactive Animated Cards -->
        <div class="stats-grid">
            <div class="stat-card income">
                <div class="stat-title">Total Received (Income)</div>
                <div class="stat-amount" id="total-income">₹0.00</div>
            </div>
            <div class="stat-card expense">
                <div class="stat-title">Total Spent (Expense)</div>
                <div class="stat-amount" id="total-expense">₹0.00</div>
            </div>
        </div>

        <!-- Recent Logs Section -->
        <div class="transactions-section">
            <h2>Recent Activity</h2>
            <div class="transaction-list" id="transaction-list">
                <div class="transaction-item">
                    <div class="tx-info">
                        <span class="tx-desc">Connected to Supabase...</span>
                        <span class="tx-date">--</span>
                    </div>
                    <span class="tx-amount">₹0.00</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
