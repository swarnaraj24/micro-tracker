<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Intelligence</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.025em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .stat-title {
            font-size: 0.85rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-amount {
            font-size: 2.25rem;
            font-weight: 700;
        }

        .stat-amount.income {
            color: #10b981;
        }

        .stat-amount.expense {
            color: #ef4444;
        }

        .transactions-section {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .transactions-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(17, 24, 39, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
        }

        .tx-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tx-desc {
            font-size: 0.95rem;
            font-weight: 500;
            color: #f3f4f6;
        }

        .tx-date {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .tx-amount {
            font-size: 1rem;
            font-weight: 600;
        }

        .tx-amount.income {
            color: #10b981;
        }

        .tx-amount.expense {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Transaction Intelligence</h1>
        </header>

        <!-- Summary Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Received (Income)</div>
                <div class="stat-amount income" id="total-income">₹0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Spent (Expense)</div>
                <div class="stat-amount expense" id="total-expense">₹0.00</div>
            </div>
        </div>

        <!-- Activity Section -->
        <div class="transactions-section">
            <h2>Recent Activity</h2>
            <div class="transaction-list" id="transaction-list">
                <div class="transaction-item">
                    <div class="tx-info">
                        <span class="tx-desc">Connected and ready for data</span>
                        <span class="tx-date">--</span>
                    </div>
                    <span class="tx-amount">₹0.00</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
