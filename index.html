<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Intelligence Pro</title>
    <!-- Supabase JS Client & Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .controls-bar input, .controls-bar select {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(16px);
        }

        .controls-bar input { flex: 1; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(16px);
        }

        .stat-title {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .stat-amount {
            font-size: 2.25rem;
            font-weight: 800;
        }

        .stat-amount.income { color: #10b981; }
        .stat-amount.expense { color: #ef4444; }

        .table-section {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(16px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            background: rgba(11, 15, 20, 0.8);
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        td {
            padding: 14px 16px;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #f3f4f6;
        }

        tr:hover td { background: rgba(30, 41, 59, 0.5); }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 6px;
        }

        .badge.expense { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .badge.income { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge.category { background: rgba(59, 130, 246, 0.15); color: #3b82f6; margin-left: 6px; }

        .truncate-desc {
            max-width: 350px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .amount-text.income { color: #10b981; font-weight: 700; }
        .amount-text.expense { color: #ef4444; font-weight: 700; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Transaction Intelligence</h1>
        </header>

        <!-- Search & Filter Controls Bar -->
        <div class="controls-bar">
            <input type="text" id="searchInput" placeholder="Search merchant or description..." oninput="filterTable()">
            <select id="typeFilter" onchange="filterTable()">
                <option value="all">All Types</option>
                <option value="expense">Expenses Only</option>
                <option value="income">Income Only</option>
            </select>
        </div>

        <!-- Stat Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Received (Income)</div>
                <div class="stat-amount income" id="total-income">₹0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Spent (Expense)</div>
                <div class="stat-amount expense" id="total-expense">₹0.00</div>
            </div>
        </div>

        <!-- Ledger Table -->
        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description & Category</th>
                        <th>Mode</th>
                        <th>Type</th>
                        <th style="text-align: right;">Amount</th>
                    </tr>
                </thead>
                <tbody id="transaction-table-body">
                    <tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">Loading database records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sxdkghnpltvdvlkblkps.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4ZGtnaG5wbHR2ZHZsa2Jsa3BzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjU5NTYsImV4cCI6MjEwODg0MTk1Nn0.2rm0p2gvSKkD6R_0YcONkg4vTyX_kdhDxfKS4AUnN3U';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let allTransactions = [];

        function cleanDescription(rawText) {
            if (!rawText) return 'Bank Transaction';
            const lower = rawText.toLowerCase();

            if (lower.includes('swiggy')) return 'Swiggy Food Order';
            if (lower.includes('zomato')) return 'Zomato Order';
            if (lower.includes('uber')) return 'Uber Ride';
            if (lower.includes('ola')) return 'Ola Cab';
            if (lower.includes('amazon')) return 'Amazon Shopping';
            if (lower.includes('flipkart')) return 'Flipkart Order';
            
            // Only flag as salary/funds credited if it genuinely is an incoming deposit and NOT an expense
            if ((lower.includes('salary') || lower.includes('credited')) && !lower.includes('debited') && !lower.includes('spent') && !lower.includes('paid')) {
                return 'Salary / Funds Credited';
            }
            
            let cleaned = rawText.replace(/^(Alert|Notification|Txn|Transaction|Info|You have done a UPI txn\. Check details!):\s*/i, '');
            if (cleaned.length < 5 || cleaned.includes('Check details')) {
                return 'UPI / Bank Transfer';
            }
            return cleaned.length > 40 ? cleaned.substring(0, 37) + '...' : cleaned;
        }

        function autoCategorize(text, isIncome) {
            if (isIncome) return 'Income';
            const lower = text.toLowerCase();
            if (lower.includes('swiggy') || lower.includes('zomato') || lower.includes('food')) return 'Food';
            if (lower.includes('uber') || lower.includes('ola') || lower.includes('metro')) return 'Travel';
            if (lower.includes('amazon') || lower.includes('flipkart')) return 'Shopping';
            if (lower.includes('electricity') || lower.includes('bill') || lower.includes('recharge')) return 'Utilities';
            return 'General';
        }

        async function loadDashboardData() {
            const { data, error } = await _supabase.from('transactions').select('*').order('date', { ascending: false });
            if (error) { console.error(error); return; }

            allTransactions = data || [];
            renderTable(allTransactions);
        }

        function renderTable(data) {
            let totalIncome = 0;
            let totalExpense = 0;
            const tbody = document.getElementById('transaction-table-body');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">No records found</td></tr>';
                document.getElementById('total-income').innerText = '₹0.00';
                document.getElementById('total-expense').innerText = '₹0.00';
                return;
            }

            data.forEach(tx => {
                const amount = Number(tx.amount);
                const rawLower = (tx.description || '').toLowerCase();
                
                // Strict check: if it mentions debited/spent/paid or was logged as expense, treat as expense
                let isIncome = tx.type === 'income' || (rawLower.includes('credited') && !rawLower.includes('debited') && !rawLower.includes('spent') && !rawLower.includes('paid'));
                if (rawLower.includes('debited') || rawLower.includes('spent') || rawLower.includes('paid')) {
                    isIncome = false;
                }

                const computedType = isIncome ? 'income' : 'expense';

                if (computedType === 'income') totalIncome += amount;
                else totalExpense += amount;

                const cleanDesc = cleanDescription(tx.description);
                const category = autoCategorize(tx.description || '', isIncome);
                const tr = document.createElement('tr');
                const sign = computedType === 'income' ? '+' : '-';
                const amountClass = computedType === 'income' ? 'income' : 'expense';

                tr.innerHTML = `
                    <td>${tx.date || '--'}</td>
                    <td class="truncate-desc" title="${escapeHtml(tx.description || '')}">
                        ${escapeHtml(cleanDesc)}
                        <span class="badge category">${category}</span>
                    </td>
                    <td>${tx.payment_mode || 'UPI'}</td>
                    <td><span class="badge ${computedType}">${computedType.toUpperCase()}</span></td>
                    <td style="text-align: right;" class="amount-text ${amountClass}">${sign}₹${amount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-income').innerText = `₹${totalIncome.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            document.getElementById('total-expense').innerText = `₹${totalExpense.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const typeVal = document.getElementById('typeFilter').value;

            const filtered = allTransactions.filter(tx => {
                const rawLower = (tx.description || '').toLowerCase();
                let isIncome = tx.type === 'income' || (rawLower.includes('credited') && !rawLower.includes('debited') && !rawLower.includes('spent') && !rawLower.includes('paid'));
                if (rawLower.includes('debited') || rawLower.includes('spent') || rawLower.includes('paid')) isIncome = false;
                const tName = isIncome ? 'income' : 'expense';

                const matchesSearch = (tx.description || '').toLowerCase().includes(query) || (tx.payment_mode || '').toLowerCase().includes(query);
                const matchesType = typeVal === 'all' || tName === typeVal;

                return matchesSearch && matchesType;
            });

            renderTable(filtered);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        loadDashboardData();
    </script>
</body>
</html>
