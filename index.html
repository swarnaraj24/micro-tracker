<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Intelligence</title>
    <!-- Include Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
        }

        .stat-title {
            font-size: 0.85rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-amount {
            font-size: 2.25rem;
            font-weight: 700;
        }

        .stat-amount.income {
            color: #10b981;
        }

        .stat-amount.expense {
            color: #ef4444;
        }

        .transactions-section {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
        }

        .transactions-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(17, 24, 39, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
        }

        .tx-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tx-desc {
            font-size: 0.95rem;
            font-weight: 500;
            color: #ffffff;
        }

        .tx-date {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .tx-amount {
            font-size: 1rem;
            font-weight: 600;
        }

        .tx-amount.income {
            color: #10b981;
        }

        .tx-amount.expense {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Transaction Intelligence</h1>
        </header>

        <!-- Summary Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Received (Income)</div>
                <div class="stat-amount income" id="total-income">₹0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Spent (Expense)</div>
                <div class="stat-amount expense" id="total-expense">₹0.00</div>
            </div>
        </div>

        <!-- Activity Section -->
        <div class="transactions-section">
            <h2>Recent Activity</h2>
            <div class="transaction-list" id="transaction-list">
                <div class="transaction-item">
                    <div class="tx-info">
                        <span class="tx-desc">Loading records from Supabase...</span>
                        <span class="tx-date">--</span>
                    </div>
                    <span class="tx-amount">₹0.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Frontend Supabase Client Connection & Rendering Logic -->
    <script>
        const SUPABASE_URL = 'https://sxdkghnpltvdvlkblkps.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4ZGtnaG5wbHR2ZHZsa2Jsa3BzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjU5NTYsImV4cCI6MjEwODg0MTk1Nn0.2rm0p2gvSKkD6R_0YcONkg4vTyX_kdhDxfKS4AUnN3U';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadDashboardData() {
            try {
                const { data, error } = await _supabase
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) {
                    console.error('Error fetching data:', error);
                    return;
                }

                let totalIncome = 0;
                let totalExpense = 0;
                const listContainer = document.getElementById('transaction-list');
                listContainer.innerHTML = '';

                if (!data || data.length === 0) {
                    listContainer.innerHTML = '<div class="transaction-item"><div class="tx-info"><span class="tx-desc">No transactions found</span></div></div>';
                    return;
                }

                data.forEach(tx => {
                    const amount = Number(tx.amount);
                    if (tx.type === 'income' || tx.type === 'bill_payment' && tx.type === 'income') {
                        totalIncome += amount;
                    } else if (tx.type === 'expense') {
                        totalExpense += amount;
                    }

                    const item = document.createElement('div');
                    item.className = 'transaction-item';
                    
                    const isIncome = tx.type === 'income';
                    const sign = isIncome ? '+' : '-';
                    const amountClass = isIncome ? 'income' : 'expense';

                    item.innerHTML = `
                        <div class="tx-info">
                            <span class="tx-desc">${escapeHtml(tx.description || 'Bank Transaction')}</span>
                            <span class="tx-date">${tx.date} • ${tx.payment_mode || 'UPI'}</span>
                        </div>
                        <span class="tx-amount ${amountClass}">${sign}₹${amount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                    `;
                    listContainer.appendChild(item);
                });

                document.getElementById('total-income').innerText = `₹${totalIncome.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
                document.getElementById('total-expense').innerText = `₹${totalExpense.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;

            } catch (err) {
                console.error('Unexpected error:', err);
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Load data on page open
        loadDashboardData();
    </script>
</body>
</html>
