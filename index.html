<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Finance Tracker</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for analytics graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Micro Finance Tracker</h1>
                <p class="text-sm text-gray-500">Automated Gmail Transaction Parser & Analytics</p>
            </div>
            <button onclick="loadDashboard()" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-xl hover:bg-blue-700 transition shadow-sm">
                Refresh Data
            </button>
        </header>

        <!-- KPI Metric Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Total Income</p>
                <p id="total-income" class="text-2xl font-bold text-green-600 mt-1">₹0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Total Expenditure</p>
                <p id="total-expense" class="text-2xl font-bold text-red-600 mt-1">₹0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Credit Card / RuPay</p>
                <p id="cc-spend" class="text-2xl font-bold text-indigo-600 mt-1">₹0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">UPI / Debit</p>
                <p id="upi-spend" class="text-2xl font-bold text-blue-600 mt-1">₹0</p>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-semibold text-gray-700 mb-4">Spending by Payment Mode</h3>
                <div class="relative h-64 flex justify-center">
                    <canvas id="paymentModeChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-semibold text-gray-700 mb-4">Income vs Expenditure</h3>
                <div class="relative h-64 flex justify-center">
                    <canvas id="incomeExpenseChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Recent Transactions Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100">
                <h3 class="text-lg font-bold text-gray-800">Recent Transactions</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-400 uppercase text-xs tracking-wider border-b border-gray-100">
                            <th class="py-3 px-6">Date</th>
                            <th class="py-3 px-6">Description</th>
                            <th class="py-3 px-6">Mode</th>
                            <th class="py-3 px-6 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-table-body" class="divide-y divide-gray-100 text-sm text-gray-700">
                        <!-- Dynamic rows populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://sxdkghnpltvdvlkblkps.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4ZGtraG5wbHR2ZHZsa2Jsa3BzIiwicm9sZSI6ImFub24iLCJpYXQiOjM2NzE2NzAzN30.R_rYm0E8c90Kjl8QxW5Zl0y7vQv8r0Kjl8QxW5Zl0y7'; // Replace with your public anon key if needed
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let paymentChartInstance = null;
        let incomeChartInstance = null;

        async function loadDashboard() {
            try {
                // Fetch transactions sorted in descending order (newest first)
                const { data: transactions, error } = await supabase
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) {
                    console.error('Supabase error:', error);
                    return;
                }

                let totalIncome = 0;
                let totalExpense = 0;
                let ccSpend = 0;
                let upiSpend = 0;

                const tableBody = document.getElementById('transaction-table-body');
                tableBody.innerHTML = '';

                if (!transactions || transactions.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400">No transactions found. Run your GitHub Actions sync workflow!</td></tr>`;
                    return;
                }

                transactions.forEach(tx => {
                    const amt = Number(tx.amount) || 0;
                    if (tx.type === 'income') {
                        totalIncome += amt;
                    } else {
                        totalExpense += amt;
                        if (tx.payment_mode && tx.payment_mode.toLowerCase().includes('credit')) {
                            ccSpend += amt;
                        } else {
                            upiSpend += amt;
                        }
                    }

                    // Build table row dynamically with exact date
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50/50 transition";
                    row.innerHTML = `
                        <td class="py-4 px-6 font-medium text-gray-600 whitespace-nowrap">${tx.date || 'N/A'}</td>
                        <td class="py-4 px-6 text-gray-800 max-w-xs truncate">${tx.description || 'Transaction'}</td>
                        <td class="py-4 px-6 whitespace-nowrap">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${tx.payment_mode && tx.payment_mode.toLowerCase().includes('credit') ? 'bg-indigo-50 text-indigo-700' : 'bg-blue-50 text-blue-700'}">
                                ${tx.payment_mode || 'UPI'}
                            </span>
                        </td>
                        <td class="py-4 px-6 text-right font-bold ${tx.type === 'income' ? 'text-green-600' : 'text-gray-900'}">
                            ${tx.type === 'income' ? '+' : '-'}₹${amt.toLocaleString('en-IN')}
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                // Update metric cards
                document.getElementById('total-income').innerText = `₹${totalIncome.toLocaleString('en-IN')}`;
                document.getElementById('total-expense').innerText = `₹${totalExpense.toLocaleString('en-IN')}`;
                document.getElementById('cc-spend').innerText = `₹${ccSpend.toLocaleString('en-IN')}`;
                document.getElementById('upi-spend').innerText = `₹${upiSpend.toLocaleString('en-IN')}`;

                // Update Charts
                updateCharts(ccSpend, upiSpend, totalIncome, totalExpense);

            } catch (err) {
                console.error('Error loading dashboard data:', err);
            }
        }

                        data: [cc, upi],
                        backgroundColor: ['#6366f1', '#3b82f6'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }

                        borderRadius: 8
                    }]
