
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#070b16;--card:rgba(20,28,48,.62);--line:rgba(255,255,255,.09);--tx:#eef2ff;--mute:#8a96b5;--in:#34d399;--out:#fb7185;--acc:#818cf8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
.scene{position:fixed;inset:0;perspective:900px;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;transition:transform .25s ease-out}
.o1{width:380px;height:380px;background:#4f46e5;left:8%;top:6%}
.o2{width:320px;height:320px;background:#0ea5e9;right:6%;top:30%}
.o3{width:300px;height:300px;background:#10b981;left:35%;bottom:-8%;opacity:.3}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:36px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select,.mod input,.mod select{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:11px 14px;border-radius:12px;font:inherit;font-size:.9rem}
.bar select option,.mod select option{background:#0f172a;color:#eef2ff}
.bar input{flex:1;min-width:180px}
:focus-visible{outline:2px solid var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{font:inherit;font-size:.8rem;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.chip.on{background:rgba(129,140,248,.2);color:#fff;border-color:var(--acc)}
.chip.warn{border-color:#f59e0b;color:#fbbf24}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px;perspective:1000px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(14px);transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .2s;will-change:transform}
.tilt:hover{box-shadow:0 24px 50px -20px rgba(99,102,241,.45)}
.card .l{font-size:.78rem;color:var(--mute);margin-bottom:10px;transform:translateZ(14px)}
.card .v{font-size:1.9rem;font-weight:800;transform:translateZ(34px);font-variant-numeric:tabular-nums}
.in .v{color:var(--in)}.out .v{color:var(--out)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:22px}
.card h2{font-size:.95rem;font-weight:600;margin-bottom:14px}
.row{display:grid;grid-template-columns:minmax(0,140px) 1fr auto;gap:10px;align-items:center;font-size:.85rem;margin-bottom:9px;cursor:pointer}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;background:rgba(255,255,255,.06);border-radius:8px;overflow:hidden}
.fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),#38bdf8);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.num{color:var(--mute);font-variant-numeric:tabular-nums}
.tablecard{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:.75rem;font-weight:600;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;font-size:.88rem;border-bottom:1px solid rgba(255,255,255,.04)}
tr[data-id]{cursor:pointer}
td.desc{max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td:first-child{white-space:nowrap}
tbody tr:hover td{background:rgba(129,140,248,.07)}
td.amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:.72rem;padding:3px 9px;border-radius:20px;background:rgba(129,140,248,.15);color:#a5b4fc;margin-left:6px}
.pill.need{background:rgba(245,158,11,.18);color:#fbbf24}
.t-income{color:var(--in)}.t-expense{color:var(--out)}.t-bill_payment,.t-transfer{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:26px}
.ov{position:fixed;inset:0;background:rgba(3,6,14,.72);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
.ov[hidden]{display:none}
.mod{background:#0f172a;border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:400px}
.mod h3{margin-bottom:6px}.mod .sub{color:var(--mute);font-size:.8rem;margin-bottom:14px;word-break:break-word}
.mod label{display:block;font-size:.78rem;color:var(--mute);margin:12px 0 5px}
.mod input[type=text],.mod input[type=email],.mod input[type=password],.mod select{width:100%}
.mod .ck{display:flex;gap:8px;align-items:center;font-size:.82rem;margin-top:12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{font:inherit;font-size:.88rem;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--tx);cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:600}
.msg{color:var(--out);font-size:.8rem;margin-top:10px;min-height:1em}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="scene"><div class="orb o1" data-d="30"></div><div class="orb o2" data-d="-22"></div><div class="orb o3" data-d="14"></div></div>
<div class="wrap">
  <div class="top"><h1>Money Flow</h1><button class="chip" id="auth">Sign in</button></div>
  <div class="bar">
    <input id="q" placeholder="Search merchant, tag, category or amount" aria-label="Search">
    <select id="month" aria-label="Month"><option value="all">All months</option></select>
    <select id="type" aria-label="Type"><option value="all">All types</option><option value="expense">Expenses</option><option value="income">Income</option><option value="transfer">Self transfers</option><option value="bill_payment">Card bill payments</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid">
    <div class="card tilt in"><div class="l">Money in</div><div class="v" id="sIn">0</div></div>
    <div class="card tilt out"><div class="l">Money out</div><div class="v" id="sOut">0</div></div>
    <div class="card tilt"><div class="l">Net</div><div class="v" id="sNet">0</div></div>
    <div class="card tilt"><div class="l">Transactions</div><div class="v" id="sCnt">0</div></div>
  </div>
  <div class="two">
    <div class="card"><h2>Spending by category</h2><div id="cats"></div></div>
    <div class="card"><h2>Top merchants</h2><div id="tops"></div></div>
  </div>
  <div class="card tablecard">
    <table><thead><tr><th>Date</th><th>Description (click a row to tag)</th><th>Mode</th><th>Type</th><th style="text-align:right">Amount</th></tr></thead><tbody id="body"><tr><td colspan="5" class="empty">Loading</td></tr></tbody></table>
  </div>
</div>
<div class="ov" id="ov" hidden><div class="mod" id="mod"></div></div>
<script>
const SB_URL='https://sxdkghnpltvdvlkblkps.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4ZGtnaG5wbHR2ZHZsa2Jsa3BzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjU5NTYsImV4cCI6MjEwODg0MTk1Nn0.2rm0p2gvSKkD6R_0YcONkg4vTyX_kdhDxfKS4AUnN3U';

// YOUR SETTINGS (lowercase)
const SELF_VPAS=[];            // your own UPI IDs, shown as Self transfer
const PEOPLE=['pavithra k'];   // payees that are people, kept out of Top merchants

const $=id=>document.getElementById(id);
const fmt=n=>'\u20b9'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=s=>s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const BRANDS=['swiggy','zomato','uber','ola','rapido','amazon','flipkart','myntra','netflix','spotify','jio','airtel','zepto','blinkit','cred','paytm'];
const CATS=[['Food',/swiggy|zomato|zepto|blinkit|restaurant|cafe|food/i],['Travel',/uber|ola|rapido|metro|irctc|redbus|fuel|petrol/i],['Shopping',/amazon|flipkart|myntra|ajio|silks|store|mart/i],['Subscriptions',/netflix|spotify|prime|hotstar|youtube/i],['Utilities',/electric|bill|recharge|jio|airtel|gas|cred/i]];
const CATNAMES=[...CATS.map(c=>c[0]),'People','Other'];
const GATEWAY=/^(rzp|razorpay|payu|cashfree|billdesk|paytmqr|bharatpe|ccav|juspay|pinelabs)/i;

const vpaOf=d=>{const m=String(d||'').match(/([a-z0-9.\-_]+@[a-z0-9]+)(?![a-z0-9]|\.[a-z])/i);return m?m[1].toLowerCase():''};
const keyOf=d=>{const v=vpaOf(d);if(v)return v;const t=String(d||'').trim().toLowerCase();return t.length<=40?t:''};
const isGw=k=>GATEWAY.test(k)||(k.includes('@')&&(k.split('@')[0].match(/[a-z]/gi)||[]).length<3);

function info(raw){
 const t=String(raw||'').replace(/\s+/g,' ').trim();
 let m=vpaOf(t);
 if(m){if(SELF_VPAS.includes(m))return{name:'Self transfer',self:true};
  if(isGw(m))return{name:'UPI '+m};
  const local=m.split('@')[0].replace(/[.\-_]?\d{5,}$/,'').replace(/[._-]+/g,' ').trim();
  return{name:title(local)};}
 m=t.match(/;\s*([^;.]+?)\s+(?:credited|debited)\b/i);
 if(m)return{name:title(m[1].trim())};
 const low=t.toLowerCase(),b=BRANDS.find(x=>new RegExp('\\b'+x+'\\b').test(low));
 if(b)return{name:title(b)};
 m=t.match(/\b(?:to|at|towards)\s+([A-Za-z][A-Za-z0-9 &.\-]{2,35}?)(?:\s+(?:on|via|ref|using)\b|[.,;(]|$)/i);
 if(m)return{name:title(m[1])};
 if(/upi txn|check details/i.test(t))return{name:'UPI payment (no details)'};
 if(/debited/i.test(t))return{name:'Bank debit'};
 if(/credited/i.test(t))return{name:'Bank credit'};
 return{name:t.slice(0,28)||'Bank transaction'};
}
const cat=(name,raw)=>(CATS.find(c=>c[1].test(name+' '+raw))||['Other'])[0];

let sb,authed=false,raw=[],all=[],rules={},cf='all',mf='',nf=false,cur=null;
function enrich(x){
 const i=info(x.description),k=keyOf(x.description),r=k&&!isGw(k)?rules[k]:null;
 const name=x.tag||(r&&r.tag)||i.name;
 const p=PEOPLE.includes(name.toLowerCase());
 const c=x.category||(r&&r.category)||(p?'People':cat(name,x.description||''));
 const need=x.type==='expense'&&!x.tag&&!r&&/^(UPI |Bank )/.test(i.name);
 return{...x,name,kind:i.self?'transfer':x.type,person:p||c==='People',cat:c,need,key:k};
}
const rebuild=()=>{all=raw.map(enrich)};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function count(el,to){if(reduce){el.textContent=fmt(to);return}const s=performance.now(),f=+el.dataset.v||0;el.dataset.v=to;
 (function step(t){const p=Math.min((t-s)/700,1),e=1-Math.pow(1-p,3);el.textContent=fmt(f+(to-f)*e);if(p<1)requestAnimationFrame(step)})(s)}
function bars(el,map){const rows=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);const max=rows[0]?rows[0][1]:1;
 el.innerHTML=rows.length?rows.map(([k,v])=>`<div class="row" data-k="${esc(k)}" title="Click to filter"><span class="nm">${esc(k)}</span><div class="track"><div class="fill" data-w="${v/max*100}"></div></div><span class="num">${fmt(v)}</span></div>`).join(''):'<div class="empty">No spending yet</div>';
 requestAnimationFrame(()=>el.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'))}
function chips(){const n=all.filter(x=>x.need).length;
 $('chips').innerHTML=['all',...CATNAMES].map(c=>`<button class="chip${cf===c?' on':''}" data-c="${esc(c)}">${c==='all'?'All categories':esc(c)}</button>`).join('')
 +`<button class="chip warn${nf?' on':''}" data-n="1">Needs tagging (${n})</button>`+(mf?`<button class="chip on" data-x="1">${esc(mf)} \u2715</button>`:'')}

function render(){
 const q=$('q').value.toLowerCase(),m=$('month').value,t=$('type').value;
 const rows=all.filter(x=>(q||m==='all'||(x.date||'').startsWith(m))&&(t==='all'||x.kind===t)&&(cf==='all'||x.cat===cf)&&(!mf||x.name===mf)&&(!nf||x.need)&&((x.name+' '+(x.description||'')+' '+x.cat+' '+x.amount+' '+(x.payment_mode||'')).toLowerCase().includes(q)));
 let i=0,o=0;const cm={},tm={};
 rows.forEach(x=>{const a=Number(x.amount);if(x.kind==='income')i+=a;else if(x.kind==='expense'){o+=a;cm[x.cat]=(cm[x.cat]||0)+a;if(!x.person)tm[x.name]=(tm[x.name]||0)+a}});
 count($('sIn'),i);count($('sOut'),o);count($('sNet'),i-o);$('sCnt').textContent=rows.length;
 bars($('cats'),cm);bars($('tops'),tm);chips();
 const label={income:'Income',expense:'Expense',transfer:'Self transfer',bill_payment:'Card bill'};
 $('body').innerHTML=rows.length?rows.map(x=>{const inc=x.kind==='income',exp=x.kind==='expense';
  return `<tr data-id="${esc(x.id)}"><td>${esc(x.date)}</td><td class="desc" title="${esc(x.description)}">${esc(x.name)}<span class="pill${x.need?' need':''}">${inc?'Income':x.need?'Needs tag':esc(x.cat)}</span></td><td>${esc(x.payment_mode)}</td><td class="t-${esc(x.kind)}">${label[x.kind]||esc(x.kind)}</td><td class="amt ${inc?'t-income':exp?'t-expense':'t-transfer'}">${inc?'+':exp?'-':''}${fmt(x.amount)}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">No transactions match these filters</td></tr>'}

// ---------- modal, sign-in, tagging ----------
const openM=h=>{$('mod').innerHTML=h;$('ov').hidden=false};
const closeM=()=>{$('ov').hidden=true};
function openLogin(){openM(`<h3>Sign in</h3><div class="sub">Needed to tag and edit transactions.</div>
 <label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
 <div class="msg" id="msg"></div><div class="btns"><button class="btn p" id="go">Sign in</button><button class="btn" id="cx">Cancel</button></div>`);
 $('cx').onclick=closeM;
 $('go').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('msg').textContent=error.message;else closeM()}}

function openEdit(id){
 if(!authed){openLogin();return}
 cur=all.find(x=>String(x.id)===String(id));if(!cur)return;
 const freq={};all.forEach(x=>{if(x.tag)freq[x.tag]=(freq[x.tag]||0)+1});
 const recent=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
 const gw=!cur.key||isGw(cur.key);
 openM(`<h3>Tag transaction</h3><div class="sub">${esc(cur.date)} | ${fmt(cur.amount)} | ${esc(cur.description)}</div>
 <label>Tag (merchant or label)</label><input id="tg" type="text" list="tl" value="${esc(cur.tag||(cur.need?'':cur.name))}" placeholder="e.g. Swiggy">
 <datalist id="tl">${recent.map(r=>`<option value="${esc(r)}">`).join('')}</datalist>
 <div class="quick">${recent.map(r=>`<button class="chip" data-q="${esc(r)}">${esc(r)}</button>`).join('')}</div>
 <label>Category</label><select id="ct">${CATNAMES.map(c=>`<option${c===cur.cat?' selected':''}>${c}</option>`).join('')}</select>
 ${gw?`<div class="sub" style="margin-top:12px">${cur.key?'Shared payment gateway ID, so this applies to this row only.':'No stable ID, so this applies to this row only.'}</div>`
  :`<label class="ck"><input id="ap" type="checkbox" checked> Apply to all rows from ${esc(cur.key)}</label>`}
 <div class="msg" id="msg"></div><div class="btns"><button class="btn p" id="sv">Save</button><button class="btn" id="rm">Remove tag</button><button class="btn" id="cx">Cancel</button></div>`);
 $('cx').onclick=closeM;
 $('mod').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('tg').value=b.dataset.q});
 $('sv').onclick=()=>save(false);$('rm').onclick=()=>save(true);
}
async function save(clear){
 const tag=clear?null:$('tg').value.trim(),category=clear?null:$('ct').value;
 if(!clear&&!tag){$('msg').textContent='Enter a tag first.';return}
 const {error}=await sb.from('transactions').update({tag,category}).eq('id',cur.id);
 if(error){$('msg').textContent=error.message;return}
 const ap=$('ap');
 if(!clear&&ap&&ap.checked){
  const {error:e2}=await sb.from('tag_rules').upsert({key:cur.key,tag,category});
  if(e2){$('msg').textContent='Tag saved, rule failed: '+e2.message;return}
  rules[cur.key]={key:cur.key,tag,category};
 }
 const r=raw.find(x=>String(x.id)===String(cur.id));r.tag=tag;r.category=category;
 rebuild();render();closeM();
}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
$('auth').onclick=async()=>{if(authed)await sb.auth.signOut();else openLogin()};

// ---------- load ----------
async function load(){
 sb=supabase.createClient(SB_URL,SB_KEY);
 sb.auth.onAuthStateChange((_e,s)=>{authed=!!s;$('auth').textContent=authed?'Sign out':'Sign in'});
 const {data:s}=await sb.auth.getSession();authed=!!s.session;$('auth').textContent=authed?'Sign out':'Sign in';
 const {data,error}=await sb.from('transactions').select('*').order('date',{ascending:false});
 if(error){console.error(error);$('body').innerHTML='<tr><td colspan="5" class="empty">Could not load data: '+esc(error.message)+'</td></tr>';return}
 const rr=await sb.from('tag_rules').select('*');
 rules=Object.fromEntries((rr.data||[]).map(r=>[r.key,r]));
 raw=data||[];rebuild();
 const months=[...new Set(all.map(x=>(x.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
 $('month').innerHTML='<option value="all">All months</option>'+months.map(x=>`<option value="${x}">${x}</option>`).join('');
 if(months[0])$('month').value=months[0];
 render();
}
['q','month','type'].forEach(id=>$(id).addEventListener('input',render));
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.n)nf=!nf;else if(b.dataset.x)mf='';else cf=b.dataset.c;render()});
$('tops').addEventListener('click',e=>{const r=e.target.closest('.row');if(r){mf=r.dataset.k;render()}});
$('cats').addEventListener('click',e=>{const r=e.target.closest('.row');if(r){cf=r.dataset.k;render()}});
$('body').addEventListener('click',e=>{const tr=e.target.closest('tr[data-id]');if(tr)openEdit(tr.dataset.id)});

if(!reduce){
 document.querySelectorAll('.tilt').forEach(c=>{
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(10px)`});
  c.addEventListener('pointerleave',()=>c.style.transform='');
 });
 addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  document.querySelectorAll('.orb').forEach(o=>{const d=+o.dataset.d;o.style.transform=`translate3d(${x*d*3}px,${y*d*3}px,0)`})});
}
load();
</script>
</body>
</html>
