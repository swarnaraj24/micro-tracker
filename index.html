<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Financial Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Transaction Intelligence</h1>
        </header>

        <!-- 3D Interactive Animated Cards -->
        <div class="stats-grid">
            <div class="stat-card income">
                <div class="stat-title">Total Received (Income)</div>
                <div class="stat-amount" id="total-income">₹0.00</div>
            </div>
            <div class="stat-card expense">
                <div class="stat-title">Total Spent (Expense)</div>
                <div class="stat-amount" id="total-expense">₹0.00</div>
            </div>
        </div>

        <!-- Recent Logs Section -->
        <div class="transactions-section">
            <h2>Recent Activity</h2>
            <div class="transaction-list" id="transaction-list">
                <!-- Dynamically loaded records go here -->
                <div class="transaction-item">
                    <div class="tx-info">
                        <span class="tx-desc">Loading transactions...</span>
                        <span class="tx-date">--</span>
                    </div>
                    <span class="tx-amount">₹0.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to hook into Supabase if hosted, or handle UI updates -->
    <script>
        // Example client binding placeholder for your front-end view
        async function fetchDashboardData() {
            // Fetch records from your Supabase transactions table here
        }
    </script>
</body>
</html>
